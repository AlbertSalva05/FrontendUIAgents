in:0 auto;padding:24px clamp(16px,4vw,32px) clamp(64px,8vw,96px)\">\n    <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\"><ol style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;list-style:none;margin:0 0 16px;padding:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\"><li><a href=\"#/\" style=\"display:inline-flex;align-items:center;min-height:44px;color:var(--color-primary)\">Home<\u002Fa><\u002Fli><li aria-hidden=\"true\" style=\"font-family:var(--font-mono)\">/<\u002Fli><li><a href=\"#/antislop\" style=\"display:inline-flex;align-items:center;min-height:44px;color:var(--color-primary)\">Anti-slop rules<\u002Fa><\u002Fli><li aria-hidden=\"true\" style=\"font-family:var(--font-mono)\">/<\u002Fli><li aria-current=\"page\" style=\"color:var(--color-text);font-family:var(--font-mono);overflow-wrap:anywhere\">{{ as.f.file }}<\u002Fli><\u002Fol><\u002Fnav>\n    <header class=\"page-heading\" style=\"display:flex;flex-direction:column;gap:8px;max-width:720px;margin-bottom:40px\">\n      <h1 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font:600 clamp(2rem,4vw,2.5rem)/1.2 var(--font-sans);letter-spacing:-0.02em;overflow-wrap:anywhere\">{{ as.f.label }}<\u002Fh1>\n      <p style=\"margin:0;font:400 1.125rem/1.75rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">{{ as.f.description }}<\u002Fp>\n      <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">{{ as.f.file }} · {{ as.f.metaLine }}<\u002Fp>\n    <\u002Fheader>\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n      <div style=\"flex:3 1 600px;min-width:0\">\n        <div class=\"code-window\" style=\"border-radius:12px;overflow:hidden;border:var(--bw) solid var(--color-border);background:var(--code-bg);box-shadow:var(--shadow-2)\">\n          <div class=\"code-window-bar\" style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 16px;background:var(--code-bar)\">\n            <span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--code-muted);overflow-wrap:anywhere\">{{ as.f.file }}<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ as.f.onDownload }}\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--code-muted);background:transparent;color:var(--code-fg);font:500 0.875rem/1.25rem var(--font-sans);cursor:pointer\" style-hover=\"background:rgba(255,255,255,.08)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M12 4v12\"><\u002Fpath><path d=\"M7 11l5 5 5-5\"><\u002Fpath><path d=\"M5 20h14\"><\u002Fpath><\u002Fsvg>Download .md<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ as.f.onCopy }}\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--code-head);background:var(--code-head);color:var(--code-filled-fg);font:600 0.875rem/1.25rem var(--font-sans);cursor:pointer\">\n                <sc-if value=\"{{ as.f.notCopied }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M9 9h11v11H9z\"><\u002Fpath><path d=\"M5 15H4V4h11v1\"><\u002Fpath><\u002Fsvg>Copy file<\u002Fsc-if>\n                <sc-if value=\"{{ as.f.copied }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M5 12.5l4.5 4.5L19 7 00 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Next<\u002Fspan><span style=\"font:600 1rem/1.5rem var(--font-sans)\">{{ as.next.label }}<\u002Fspan><\u002Fa>\n        <\u002Fnav>\n      <\u002Fdiv>\n      <aside class=\"side-column\" aria-label=\"About this file\" style=\"flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n        <nav aria-labelledby=\"h-as-toc\" style=\"padding:16px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\">\n          <h2 id=\"h-as-toc\" style=\"margin:0 0 8px;padding:0 8px;font:600 1rem/1.5rem var(--font-sans)\">Sections in this file<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0\"><sc-for list=\"{{ as.toc }}\" as=\"h\"><li><button type=\"button\" sc-camel-on-click=\"{{ h.onClick }}\" style=\"display:flex;align-items:center;width:100%;min-height:44px;padding:4px 8px;border:0;border-radius:4px;background:transparent;color:var(--color-primary);font:500 0.9375rem/1.25rem var(--font-sans);text-align:left;cursor:pointer\" style-hover=\"background:var(--color-sunken)\">{{ h.t }}<\u002Fbutton><\u002Fli><\u002Fsc-for><\u002Ful>\n        <\u002Fnav>\n        <section aria-labelledby=\"h-as-other\" style=\"display:flex;flex-direction:column;gap:8px\">\n          <h2 id=\"h-as-other\" style=\"margin:0;font:600 1rem/1.5rem var(--font-sans)\">Other files<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0\"><sc-for list=\"{{ as.others }}\" as=\"o\"><li style=\"border-top:var(--bw) solid var(--color-border)\"><a href=\"{{ o.href }}\" style=\"display:flex;flex-direction:column;gap:4px;padding:12px 0;text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-primary)\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">{{ o.label }}<\u002Fspan><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">{{ o.file }}<\u002Fspan><\u002Fa><\u002Fli><\u002Fsc-for><\u002Ful>\n        <\u002Fsection>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is404 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page-not-found\" style=\"max-width:800px;margin:0 auto;padding:clamp(48px,10vw,120px) clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:24px\">\n    <p style=\"margin:0;font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-accent)\">Error 404<\u002Fp>\n    <h1 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font:600 clamp(2rem,5vw,3rem)/1.2 var(--font-sans);letter-spacing:-0.02em;text-wrap:balance\">This page is not in the collection<\u002Fh1>\n    <p style=\"margin:0;padding:16px;border-radius:8px;background:var(--color-sunken);border:var(--bw) solid var(--color-border);font:400 0.9375rem/1.5rem var(--font-mono);overflow-wrap:anywhere\">No file at {{ notFoundPath }}<\u002Fp>\n    <p style=\"margin:0;font:400 1.125rem/1.75rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">The link may be out of date, or the prompt may have moved to another folder. Search the library to find it again.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n      <a href=\"#/prompts\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);text-decoration:none\" style-hover=\"background:var(--color-primary-hover);color:var(--color-on-primary)\">Search the prompt library<\u002Fa>\n      <a href=\"#/\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans);text-decoration:none\" style-hover=\"background:var(--color-sunken);color:var(--color-text)\">Back to the home page<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ system }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page-design-system\" style=\"max-width:1200px;margin:0 auto;padding:24px clamp(16px,4vw,32px) clamp(64px,8vw,96px)\">\n    <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\"><ol style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;list-style:none;margin:0 0 16px;padding:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\"><li><a href=\"#/\" style=\"display:inline-flex;align-items:center;min-height:44px;color:var(--color-primary)\">Home<\u002Fa><\u002Fli><li aria-hidden=\"true\" style=\"font-family:var(--font-mono)\">/<\u002Fli><li aria-current=\"page\" style=\"color:var(--color-text)\">Design system<\u002Fli><\u002Fol><\u002Fnav>\n    <header class=\"page-heading\" style=\"display:flex;flex-direction:column;gap:8px;max-width:720px;margin-bottom:40px\">\n      <h1 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font:600 clamp(2rem,4vw,2.5rem)/1.2 var(--font-sans);letter-spacing:-0.02em\">Design system<\u002Fh1>\n      <p style=\"margin:0;font:400 1.125rem/1.75rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">The tokens, type, spacing and component states behind this site, documented for handover to Figma and code. Layer names match the kebab-case class names in the source.<\u002Fp>\n      <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">v1.3.0 · primitives → semantic tokens → components<\u002Fp>\n    <\u002Fheader>\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n      <div class=\"ds-body\" style=\"flex:3 1 600px;min-width:0;display:flex;flex-direction:column;gap:80px\">\n        <section id=\"ds-decisions\" tabindex=\"-1\" aria-labelledby=\"h-ds-decisions\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-decisions\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Decision log<\u002Fh2>\n          <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:24px\">\n            <sc-for list=\"{{ decisions }}\" as=\"x\" hint-placeholder-count=\"8\"><div style=\"display:flex;flex-direction:column;gap:4px;padding-top:16px;border-top:2px solid var(--color-text)\"><dt style=\"font:600 1rem/1.5rem var(--font-sans)\">{{ x.k }}<\u002Fdt><dd style=\"margin:0;color:var(--color-text-muted);font:400 0.9375rem/1.5rem var(--font-sans)\">{{ x.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdl>\n        <\u002Fsection>\n\n        <section id=\"ds-logo\" tabindex=\"-1\" aria-labelledby=\"h-ds-logo\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-logo\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Logo lockups<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">The mark is a prompt caret and cursor inside a 40px tile. Keep clear space equal to the tile corner radius (10px at 40px) on every side. Never place the light lockup on a dark ground. Placeholder mark: replace it if your brand already has a logo.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px\">\n            <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;align-items:center;justify-content:center;min-height:128px;padding:24px;border-radius:12px;background:#f6f4ef;border:var(--bw) solid var(--color-border)\"><img src=\"ae2a972b-3c21-4cf2-a9cd-bbb19cc8dfe0\" alt=\"Frontend UI Design Agents lockup, light version\" width=\"280\" height=\"40\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\u002Fdiv><figcaption style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 0.8125rem/1.25rem var(--font-mono)\"><span>logo_lockup_light_01.svg<\u002Fspan><a href=\"assets/logo/logo_lockup_light_01.svg\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px\">Download<\u002Fa><\u002Ffigcaption><\u002Ffigure>\n            <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;align-items:center;justify-content:center;min-height:128px;padding:24px;border-radius:12px;background:#161513;border:var(--bw) solid var(--color-border)\"><img src=\"3b4a5a99-8fad-464d-b36c-9412915ff4a6\" alt=\"Frontend UI Design Agents lockup, dark version\" width=\"280\" height=\"40\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\u002Fdiv><figcaption style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 0.8125rem/1.25rem var(--font-mono)\"><span>logo_lockup_dark_02.svg<\u002Fspan><a href=\"assets/logo/logo_lockup_dark_02.svg\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px\">Download<\u002Fa><\u002Ffigcaption><\u002Ffigure>\n            <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;align-items:center;justify-content:center;min-height:128px;padding:24px;border-radius:12px;background:#ffffff;border:2px solid #000000\"><img src=\"091a1846-0b97-4f2d-8dcb-e9a414a0e73f\" alt=\"Frontend UI Design Agents lockup, one-color version\" width=\"280\" height=\"40\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\u002Fdiv><figcaption style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 0.8125rem/1.25rem var(--font-mono)\"><span>logo_lockup_mono_03.svg<\u002Fspan><a href=\"assets/logo/logo_lockup_mono_03.svg\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px\">Download<\u002Fa><\u002Ffigcaption><\u002Ffigure>\n            <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;align-items:center;justify-content:center;min-height:128px;padding:24px;border-radius:12px;background:var(--color-sunken);border:var(--bw) solid var(--color-border)\"><img src=\"d518c282-4fce-462d-983e-41f2f2ae9df5\" alt=\"Frontend UI Design Agents mark\" width=\"64\" height=\"64\" loading=\"lazy\"><\u002Fdiv><figcaption style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 0.8125rem/1.25rem var(--font-mono)\"><span>logo_mark_01.svg<\u002Fspan><a href=\"assets/logo/logo_mark_01.svg\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px\">Download<\u002Fa><\u002Ffigcaption><\u002Ffigure>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"ds-color\" tabindex=\"-1\" aria-labelledby=\"h-ds-color\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-color\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Color<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">Primitives are raw values and are never used in components. Components read semantic tokens only, which is how the dark and high-contrast themes swap without touching markup.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px\">\n            <sc-for list=\"{{ prims }}\" as=\"c\" hint-placeholder-count=\"20\"><li style=\"display:flex;flex-direction:column;gap:8px\"><span aria-hidden=\"true\" style=\"height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.12);background:{{ c.hex }}\"><\u002Fspan><span style=\"font:500 0.8125rem/1.25rem var(--font-mono)\">{{ c.name }}<\u002Fspan><span style=\"font:400 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">{{ c.hex }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n          <div role=\"region\" aria-label=\"Semantic tokens\" tabindex=\"0\" style=\"overflow-x:auto;border-radius:12px;border:var(--bw) solid var(--color-border)\">\n            <sc-raw-table style=\"width:100%;min-width:640px;border-collapse:collapse;font:400 0.875rem/1.25rem var(--font-sans)\">\n              <sc-raw-thead><sc-raw-tr style=\"background:var(--color-sunken);text-align:left\"><sc-raw-th scope=\"col\" style=\"padding:12px 16px\">Token<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding:12px 16px\">Role<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding:12px 16px\">Light<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding:12px 16px\">Dark<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding:12px 16px\">High contrast<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody><sc-for list=\"{{ semantic }}\" as=\"t\"><sc-raw-tr style=\"border-top:var(--bw) solid var(--color-border)\"><sc-raw-th scope=\"row\" style=\"padding:12px 16px;text-align:left;font:500 0.8125rem/1.25rem var(--font-mono)\">{{ t.token }}<\u002Fsc-raw-th><sc-raw-td style=\"padding:12px 16px\">{{ t.role }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 16px;font-family:var(--font-mono)\">{{ t.light }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 16px;font-family:var(--font-mono)\">{{ t.dark }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 16px;font-family:var(--font-mono)\">{{ t.contrast }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Checked pairs (light theme): text on bg 15.3:1, muted text on bg 6.7:1, primary on bg 6.6:1, on-primary text on primary 7.1:1, accent on bg 5.6:1, every status badge 5.5:1 or higher, border-strong on bg 3.3:1 for control edges. Dark theme: every pair 5.7:1 or higher. High contrast: 11:1 or higher.<\u002Fp>\n        <\u002Fsection>\n\n        <section id=\"ds-type\" tabindex=\"-1\" aria-labelledby=\"h-ds-type\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-type\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Typography<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">Base 16px with line heights on a 4px baseline. Sizes are in rem, so the three visitor text sizes (100%, 112.5%, 125%) scale every style together. Three weights only: 400, 500, 600.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n            <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"9\"><li style=\"display:flex;flex-wrap:wrap;gap:8px 24px;padding:16px 0;border-top:var(--bw) solid var(--color-border);align-items:baseline\"><span style=\"flex:0 0 200px;display:flex;flex-direction:column;gap:2px;font:400 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\"><span style=\"font-weight:500;color:var(--color-text)\">{{ t.token }}<\u002Fspan><span>{{ t.size }} / {{ t.lh }}<\u002Fspan><span>weight {{ t.weight }} · tracking {{ t.tracking }}<\u002Fspan><\u002Fspan><span style=\"flex:1 1 280px;min-width:0;overflow-wrap:anywhere;font:{{ t.css }}\">{{ t.sample }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n          <div style=\"padding:24px;border-radius:12px;background:var(--color-sunken);border:var(--bw) solid var(--color-border);display:flex;flex-direction:column;gap:8px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Font licences<\u002Fh3>\n            <p style=\"margin:0\">IBM Plex Sans and IBM Plex Mono are licensed under the SIL Open Font License 1.1. You may use, embed, self-host and modify them on the web and in apps at no cost. You may not sell the font files on their own. Loaded from Google Fonts with font-display: swap; self-hosting the WOFF2 files works the same way.<\u002Fp>\n            <a href=\"https://openfontlicense.org\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:44px;align-self:flex-start\">Read the SIL Open Font License<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section id=\"ds-space\" tabindex=\"-1\" aria-labelledby=\"h-ds-space\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-space\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Spacing<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">An 8px grid. The 4px half step is only for icon-to-label gaps. Spacing stays in px so it does not grow with the text size setting; text reflows instead.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n            <sc-for list=\"{{ space }}\" as=\"x\" hint-placeholder-count=\"8\"><li style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px 0;border-top:var(--bw) solid var(--color-border)\"><span style=\"flex:0 0 136px;font:500 0.8125rem/1.25rem var(--font-mono)\">{{ x.token }} · {{ x.px }}px<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none;height:16px;border-radius:2px;background:var(--color-accent);width:{{ x.w }}\"><\u002Fspan><span style=\"flex:1 1 200px;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ x.use }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fsection>\n\n        <section id=\"ds-grid\" tabindex=\"-1\" aria-labelledby=\"h-ds-grid\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-grid\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Grid and breakpoints<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">Mobile first. Columns wrap when content needs the room (flex-basis and auto-fill grids), so there are no dead zones between breakpoints. Container max width 1200px.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px\">\n            <div style=\"padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);display:flex;flex-direction:column;gap:8px\"><h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Mobile<\u002Fh3><p style=\"margin:0;font:400 0.875rem/1.5rem var(--font-mono);color:var(--color-text-muted)\">320 to 767px<br>4 columns<br>16px gutter, 16px margin<\u002Fp><\u002Fdiv>\n            <div style=\"padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);display:flex;flex-direction:column;gap:8px\"><h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Tablet<\u002Fh3><p style=\"margin:0;font:400 0.875rem/1.5rem var(--font-mono);color:var(--color-text-muted)\">768 to 1023px<br>8 columns<br>24px gutter, 24px margin<\u002Fp><\u002Fdiv>\n            <div style=\"padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);display:flex;flex-direction:column;gap:8px\"><h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Desktop<\u002Fh3><p style=\"margin:0;font:400 0.875rem/1.5rem var(--font-mono);color:var(--color-text-muted)\">1024px and up<br>12 columns<br>24px gutter, 32px margin<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"ds-elevation\" tabindex=\"-1\" aria-labelledby=\"h-ds-elevation\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-elevation\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Elevation and radius<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:24px\">\n            <div style=\"padding:24px;border-radius:12px;background:var(--color-surface);border:var(--bw) solid var(--color-border);box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono)\">--shadow-1<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Resting cards in a list. Just enough to lift them off the page.<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:24px;border-radius:12px;background:var(--color-surface);border:var(--bw) solid var(--color-border);box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono)\">--shadow-2<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Code windows, the one focal object per screen.<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:24px;border-radius:12px;background:var(--color-surface);border:var(--bw) solid var(--color-border);box-shadow:var(--shadow-3);display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono)\">--shadow-3<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Popovers, dialogs and toasts that sit above everything.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Radius: 4px badges and line highlights, 8px controls, 12px cards and windows, 16px feature panels. The high-contrast theme removes shadows and uses 2px borders instead.<\u002Fp>\n        <\u002Fsection>\n\n        <section id=\"ds-components\" tabindex=\"-1\" aria-labelledby=\"h-ds-components\" style=\"display:flex;flex-direction:column;gap:32px\">\n          <h2 id=\"h-ds-components\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Components and states<\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">button-primary and button-secondary<\u002Fh3>\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center\">\n              <span style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans)\">Default<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary-hover);background:var(--color-primary-hover);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans)\">Hover<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);outline:3px solid var(--color-focus);outline-offset:2px\">Focus<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) dashed var(--color-border-strong);background:var(--color-sunken);color:var(--color-text-muted);font:600 1rem/1.5rem var(--font-sans)\">Disabled<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans)\">Secondary<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Minimum height 48px for page actions, 44px for inline controls. Disabled uses a dashed edge as well as a muted color, so the state does not rely on color alone.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">status-badge: four availability states<\u002Fh3>\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n              <sc-for list=\"{{ statuses }}\" as=\"st\" hint-placeholder-count=\"4\"><span class=\"status-badge\" style=\"display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:2px 8px;border-radius:4px;background:{{ st.bg }};color:{{ st.fg }};font:600 0.8125rem/1.25rem var(--font-sans)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><sc-for list=\"{{ st.icon }}\" as=\"sp\"><path d=\"{{ sp }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg>{{ st.label }}<\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Each state has its own icon and label. Color is the third signal, never the only one.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">form-field<\u002Fh3>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:24px\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">Default<\u002Fspan><span style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-bg);color:var(--color-text-muted)\">Brand name<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">Focus<\u002Fspan><span style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-bg);outline:3px solid var(--color-focus);outline-offset:2px\">TechFlow<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">Error<\u002Fspan><span style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:8px;border:2px solid var(--color-error);background:var(--color-bg)\">name@<\u002Fspan><span style=\"font:500 0.875rem/1.25rem var(--font-sans);color:var(--color-error)\">Error: Check the email format.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">Disabled<\u002Fspan><span style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:8px;border:var(--bw) dashed var(--color-border-strong);background:var(--color-sunken);color:var(--color-text-muted)\">Not editable<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Content states<\u002Fh3>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:24px\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">loading<\u002Fspan><div aria-hidden=\"true\" style=\"display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\"><span style=\"width:60%;height:12px;border-radius:4px;background:var(--color-sunken)\"><\u002Fspan><span style=\"width:90%;height:20px;border-radius:4px;background:var(--color-sunken)\"><\u002Fspan><span style=\"width:100%;height:40px;border-radius:4px;background:var(--color-sunken)\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">empty<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:12px;border:var(--bw) dashed var(--color-border-strong);background:var(--color-surface)\"><strong>No prompts in this folder yet<\u002Fstrong><span style=\"color:var(--color-text-muted);font-size:0.875rem;line-height:1.25rem\">Say what the empty space means, then offer one next step.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">error<\u002Fspan><div style=\"display:flex;gap:12px;padding:24px;border-radius:12px;border:var(--bw) solid var(--color-error);background:var(--color-error-soft)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"flex:none;color:var(--color-error);margin-top:2px\"><path d=\"M12 3l10 18H2z\"><\u002Fpath><path d=\"M12 10v5\"><\u002Fpath><path d=\"M12 18v.01\"><\u002Fpath><\u002Fsvg><span><strong>Files did not load.<\u002Fstrong> Name the cause, then give a retry.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">long text<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface);min-width:0\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted);overflow-wrap:anywhere\">prompts/accessibility/screen-reader-optimization-for-data-tables.md<\u002Fspan><strong style=\"font-size:1.125rem;line-height:1.75rem;overflow-wrap:anywhere\">Screen Reader Optimization for Sortable, Filterable Data Tables With Sticky Headers<\u002Fstrong><span style=\"color:var(--color-text-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden\">Titles wrap and never truncate. Paths break anywhere. Summaries clamp to three lines on cards and show in full on the prompt page, so nothing is lost.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">missing image<\u002Fspan><div style=\"display:flex;flex-direction:column;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface);overflow:hidden\"><div role=\"img\" aria-label=\"Image not available\" style=\"display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;background:repeating-linear-gradient(135deg,var(--color-sunken) 0 8px,var(--color-bg) 8px 16px);font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted);padding:16px;text-align:center\">img_prompt_cover_01.jpg<br>image not available<\u002Fdiv><div style=\"padding:16px\"><strong>The card keeps its shape<\u002Fstrong><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">See each pattern live<\u002Fh3>\n            <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 24px\">\n              <li><button type=\"button\" sc-camel-on-click=\"{{ openNotice }}\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0;border:0;background:transparent;color:var(--color-primary);font:500 1rem/1.5rem var(--font-sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Notice modal<\u002Fbutton><\u002Fli>\n              <li><a href=\"{{ noResultsDemo }}\" style=\"display:inline-flex;align-items:center;min-height:44px\">Search with no results<\u002Fa><\u002Fli>\n                            <li><a href=\"#/prompts/design-system-generator\" style=\"display:inline-flex;align-items:center;min-height:44px\">Breadcrumbs and side column<\u002Fa><\u002Fli>\n              <li><a href=\"#/this-page-does-not-exist\" style=\"display:inline-flex;align-items:center;min-height:44px\">404 page<\u002Fa><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"ds-icons\" tabindex=\"-1\" aria-labelledby=\"h-ds-icons\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-icons\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Icons<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">24px grid, 1.75px stroke, round caps. Category icons use the prefix icn_category_, interface icons use icn_ui_. Every file uses currentColor in code and #1f1d1a in the exported SVG.<\u002Fp>\n          <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Category icons<\u002Fh3>\n          <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px\">\n            <sc-for list=\"{{ catIcons }}\" as=\"i\" hint-placeholder-count=\"7\"><li style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\"><svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"color:var(--color-primary)\"><sc-for list=\"{{ i.paths }}\" as=\"p\"><path d=\"{{ p }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg><span style=\"font:500 0.75rem/1rem var(--font-mono);overflow-wrap:anywhere\">{{ i.file }}<\u002Fspan><a href=\"{{ i.src }}\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px;font-size:0.875rem\">Download SVG<\u002Fa><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n          <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Interface icons<\u002Fh3>\n          <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px\">\n            <sc-for list=\"{{ uiIcons }}\" as=\"i\" hint-placeholder-count=\"14\"><li style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><sc-for list=\"{{ i.paths }}\" as=\"p\"><path d=\"{{ p }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg><span style=\"font:500 0.75rem/1rem var(--font-mono);overflow-wrap:anywhere\">{{ i.file }}<\u002Fspan><a href=\"{{ i.src }}\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px;font-size:0.875rem\">Download SVG<\u002Fa><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fsection>\n\n        <section id=\"ds-log\" tabindex=\"-1\" aria-labelledby=\"h-ds-log\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-log\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Build log<\u002Fh2>\n          <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n            <sc-for list=\"{{ phases }}\" as=\"p\" hint-placeholder-count=\"6\"><li style=\"display:flex;flex-wrap:wrap;gap:8px 24px;padding:16px 0;border-top:var(--bw) solid var(--color-border)\"><span style=\"flex:0 0 120px;font:600 1rem/1.5rem var(--font-sans)\">{{ p.n }}<\u002Fspan><span style=\"flex:0 0 80px;font:500 0.8125rem/1.5rem var(--font-mono);color:var(--color-primary)\">{{ p.s }}<\u002Fspan><span style=\"flex:1 1 260px;color:var(--color-text-muted)\">{{ p.t }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n          <\u002Fol>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <aside class=\"side-column\" aria-label=\"Design system sections\" style=\"flex:1 1 240px;min-width:0;position:{{ dsAsidePos }};top:88px\">\n        <nav aria-labelledby=\"h-ds-toc\" style=\"padding:16px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\">\n          <h2 id=\"h-ds-toc\" style=\"margin:0 0 8px;padding:0 8px;font:600 1rem/1.5rem var(--font-sans)\">Sections<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0\"><sc-for list=\"{{ dsToc }}\" as=\"t\" hint-placeholder-count=\"10\"><li><button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"display:flex;align-items:center;width:100%;min-height:44px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:var(--color-primary);font:500 0.9375rem/1.25rem var(--font-sans);text-align:left;cursor:pointer\" style-hover=\"background:var(--color-sunken)\">{{ t.label }}<\u002Fbutton><\u002Fli><\u002Fsc-for><\u002Ful>\n        <\u002Fnav>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fmain>\n<footer class=\"site-footer\" style=\"border-top:var(--bw) solid var(--color-border);background:var(--color-surface)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:48px clamp(16px,4vw,32px);display:flex;flex-wrap:wrap;gap:32px 64px;justify-content:space-between\">\n    <div style=\"flex:1 1 280px;display:flex;flex-direction:column;gap:12px;max-width:420px\">\n      <p style=\"margin:0;font:600 1rem/1.5rem var(--font-sans)\">Frontend UI Design Agents Collection<\u002Fp>\n      <p style=\"margin:0;font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">Claude prompts for frontend development, grouped by the folder you would find them in.<\u002Fp>\n      <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">v1.3.0 · MIT licence · updated 30 Sep 2026<\u002Fp>\n    <\u002Fdiv>\n    <nav aria-label=\"Footer\" style=\"flex:0 1 auto\">\n      <ul style=\"list-s padding:12px 20px;border-radius:8px;background:var(--color-text);color:var(--color-bg);box-shadow:var(--shadow-3);font:500 0.9375rem/1.5rem var(--font-sans)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"flex:none\"><path d=\"M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0\"><\u002Fpath><path d=\"M12 11v6\"><\u002Fpath><path d=\"M12 7.5v.01\"><\u002Fpath><\u002Fsvg><span>{{ toast }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CATS=[\n{id:'ui-design',label:'UI Design',comment:'UI design prompts',blurb:'Interface design prompts for creating beautiful and functional user interfaces.',topics:['Wireframing and prototyping','Color scheme generation','Typography selection','Layout design']},\n{id:'web-development',label:'Web Development',comment:'Web development prompts',blurb:'General web development prompts for modern frontend technologies.',topics:['HTML structure generation','CSS styling and layouts','JavaScript functionality','Performance optimization']},\n{id:'components',label:'Components',comment:'Component development prompts',blurb:'Framework-specific component development prompts.',topics:['React components','Vue.js components','Angular components','Web components']},\n{id:'ux-research',label:'UX Research',comment:'UX research and usability prompts',blurb:'User experience research and usability testing prompts.',topics:['User persona creation','User journey mapping','Usability testing','Accessibility audits']},\n{id:'animation',label:'Animation',comment:'CSS/JS animation prompts',blurb:'CSS and JavaScript animation prompts for engaging user experiences.',topics:['CSS animations','JavaScript animations','Micro-interactions','Loading animations']},\n{id:'responsive',label:'Responsive',comment:'Responsive design prompts',blurb:'Responsive design prompts for mobile-first development.',topics:['Mobile-first design','Breakpoint strategies','Flexible layouts','Cross-device testing']},\n{id:'accessibility',label:'Accessibility',comment:'Accessibility prompts',blurb:'Web accessibility prompts for inclusive design.',topics:['ARIA implementation','Keyboard navigation','Screen reader optimization','Color contrast testing']}];\nconst IC={check:['M5 12.5l4.5 4.5L19 7'],info:['M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0','M12 11v6','M12 7.5v.01'],alert:['M12 3l10 18H2z','M12 10v5','M12 18v.01'],close:['M6 6l12 12','M18 6L6 18']};\nconst STATUS={\nstable:{id:'stable',label:'Stable',note:'Structure is complete. Paste and fill in the placeholders.',icon:IC.check,fg:'var(--color-success)',bg:'var(--color-success-soft)'},\nbeta:{id:'beta',label:'Beta',note:'Usable today. Wording and structure may still change.',icon:IC.info,fg:'var(--color-info)',bg:'var(--color-info-soft)'},\nrevision:{id:'revision',label:'Under revision',note:'Being rewritten. Check the notes before you paste it.',icon:IC.alert,fg:'var(--color-warning)',bg:'var(--color-warning-soft)'},\nretired:{id:'retired',label:'Retired',note:'Kept for reference only. No longer maintained.',icon:IC.close,fg:'var(--color-text-muted)',bg:'var(--color-sunken)'}};\nconst STATUS_NOTE={'mobile-design-philosophy':'Beta: this file has no agent frontmatter (name, description, model) yet, so tools that load agents by name will not pick it up.','universal-ui-design-methodology':'Under revision: the prompt is written around Tailwind, cva and an index.css file. Swap those references if your stack is different.'};\nconst DIFF={Beginner:1,Intermediate:2,Advanced:3};\nconst ROUTE=[['ux-research','Know who you are building for'],['ui-design','Plan screens and set the visual rules'],['web-development','Organise the structure and CSS'],['responsive','Make it reflow from 320px up'],['components','Build the reusable parts'],['animation','Add feedback under 300ms'],['accessibility','Check it works for everyone']];\nconst MAP_WIDE=[[96,248],[232,120],[376,216],[520,96],[664,200],[800,104],[896,240]];\nconst MAP_TALL=[[40,56],[96,144],[40,232],[96,320],[40,408],[96,496],[40,584]];\nconst AS_MENU=[['summary','Combined summary','all six files'],['antislop','Core filter','antislop.md'],['antislop-ui','UI and visual','antislop-ui.md'],['antislop-copywriting','Copy and text','antislop-copywriting.md'],['antislop-human','People and accessibility','antislop-human.md'],['antislop-layoutmobile','Mobile layout','antislop-layoutmobile.md'],['antislop-code','Code comments','antislop-code.md']];\nconst asColor=l=>/^#{1,6} /.test(l)?'var(--code-head)':/^(```|>|---$)/.test(l)?'var(--code-muted)':'var(--code-fg)';\nconst FLOW=[\n{n:1,title:'Discover',goal:'Understand who you are building for and where they struggle.',steps:['user-persona-generator','user-journey-mapping'],carry:'Personas and a journey map with ranked pain points.',tip:'If recent research exists, paste it in rather than starting from assumptions.'},\n{n:2,title:'Plan the structure',goal:'Decide the screens, flows and page skeleton before any styling.',steps:['wireframe-prototyper','html-structure-generator'],carry:'Screen inventory, user flows and semantic HTML outlines.',tip:'Paste the journey map from phase 1 so wireframes target the real pain points.'},\n{n:3,title:'Set the visual system',goal:'Define tokens, color, type and mobile rules once, so every component shares them.',steps:['universal-ui-design-methodology','design-system-generator','color-scheme-generator','typography-selection','mobile-design-philosophy'],carry:'Design tokens, a palette with contrast pairs and a type scale.',tip:'Use the methodology or the generator as the main pass, then refine color and type with the next two.'},\n{n:4,title:'Plan CSS and layout',goal:'Choose how styles are organized and how layouts reflow.',steps:['css-architecture','breakpoint-strategy','mobile-first-layout'],carry:'Folder structure, naming rules, breakpoints and page layouts.',tip:'Give the CSS prompt your tokens from phase 3 so they become custom properties.'},\n{n:5,title:'Build components',goal:'Generate the reusable parts in your framework.',steps:['react-components-generator','vue-component-generator','angular-component-generator','web-components-generator'],carry:'Components with loading, empty and error states.',tip:'Use only the generator that matches your stack. Build one component per prompt run.'},\n{n:6,title:'Add interaction and feedback',goal:'Make every action answer the user without distracting them.',steps:['micro-interactions','loading-animations'],carry:'Hover, press, loading and success states with reduced-motion fallbacks.',tip:'Measure real wait times before choosing a loading pattern.'},\n{n:7,title:'Make it accessible',goal:'Check it works with a keyboard, a screen reader and low vision.',steps:['aria-implementation','keyboard-navigation','screen-reader-optimization','color-contrast-testing'],carry:'Fixed markup, focus management and a contrast table.',tip:'Findings about color or spacing go back to phase 3, so the fix reaches every component.'},\n{n:8,title:'Test and ship',goal:'Confirm real people can use it on real devices at real speeds.',steps:['usability-testing-script','cross-device-testing','performance-audit'],carry:'Test findings, device results and a performance fix list.',tip:'Fix launch blockers first, then re-run the audit on the same devices.'}];\nconst ORDER=FLOW.flatMap(p=>p.steps);\nconst USE={'user-persona-generator':'Build 3 to 5 personas from what you know about your users.','user-journey-mapping':'Map one persona\\'s path to one goal and rank the pain points.','wireframe-prototyper':'List every screen and state, then plan flows at low fidelity.','html-structure-generator':'Turn each key screen into landmarks and a heading outline.','universal-ui-design-methodology':'Set the token architecture and color reasoning for the brand.','design-system-generator':'Generate tokens, spacing, type and component specs.','color-scheme-generator':'Extend brand colors into ramps and tested contrast pairs.','typography-selection':'Pick web-licensed fonts and a baseline type scale.','mobile-design-philosophy':'Add touch targets, mobile type and platform rules.','css-architecture':'Decide file structure, naming and how tokens reach the CSS.','breakpoint-strategy':'Choose breakpoints from where your content breaks.','mobile-first-layout':'Build page layouts from 320px up.','react-components-generator':'Generate components if your stack is React.','vue-component-generator':'Generate components if your stack is Vue 3.','angular-component-generator':'Generate components if your stack is Angular.','web-components-generator':'Generate framework-free custom elements.','micro-interactions':'Design hover, press and feedback states under 300ms.','loading-animations':'Match loading indicators to real wait times.','aria-implementation':'Add correct roles and states to custom widgets.','keyboard-navigation':'Audit tab order, focus and key patterns.','screen-reader-optimization':'Fix reading order, labels and live announcements.','color-contrast-testing':'Check every color pair in every theme.','usability-testing-script':'Script a moderated test of your key flows.','cross-device-testing':'Plan device, browser and network testing.','performance-audit':'Audit Core Web Vitals and fix by impact.'};\nconst PREP=[['Write a one-paragraph brief','Who the product is for, the problem it solves, the goal of this project and how you will know it worked.'],['Collect your constraints','Brand assets, any existing design system, tech stack, browser support, deadline and team size.'],['Choose the framework early','It decides which component prompt you use in phase 5 and how the CSS is organized.'],['Set quality targets up front','A WCAG level (AA is the usual minimum) and a performance budget, so every prompt can be told about them.'],['Gather real content','Real copy, data and images, or clearly labelled placeholders. Prompts give better output with real material.'],['Pick a design direction','Write a short DESIGN.md or brand brief, and decide whether the anti-slop rules apply during the build or as an audit.'],['Keep one project document','Paste each prompt\\'s output there. Each later prompt should receive the earlier outputs it depends on.']].map(([h,t],i)=>({h,t,n:String(i+1).padStart(2,'0')}));\nconst PH_SPLIT=/(\\[[^\\]\\s][^\\]\\n]*\\])/g;\nconst PH_ONE=/^\\[[^\\]\\s][^\\]\\n]*\\]$/;\nconst uniqPh=t=>{const out=[];(t.match(PH_SPLIT)||[]).forEach(m=>{if(!out.includes(m))out.push(m)});return out};\nconst lineColor=l=>/^\\s*#{1,6} /.test(l)||/^\\s*[A-Z][A-Z0-9 \\/&()-]{2,}:/.test(l)?'var(--code-head)':/^\\s*(```|\\/\\*|\\/\\/)/.test(l)?'var(--code-muted)':'var(--code-fg)';\nconst PRIMS=['sand-0:#fffdf9','sand-50:#f6f4ef','sand-100:#efebe3','sand-200:#dcd6ca','sand-400:#8c8577','sand-600:#5a554c','sand-900:#1f1d1a','moss-100:#e2ece4','moss-300:#8fcfa0','moss-600:#2e6146','moss-700:#244d38','clay-100:#f4e4d9','clay-300:#eaa27a','clay-600:#9a4a26','ochre-100:#f5ebcf','ochre-700:#7f5500','brick-100:#f6e0dc','brick-600:#a3322a','slate-100:#e3e9ec','slate-600:#3f5663'].map(s=>{const [n,h]=s.split(':');return{name:n,hex:h,dark:['sand-400','sand-600','sand-900','moss-600','moss-700','clay-600','ochre-700','brick-600','slate-600'].includes(n)}});\nconst SEMANTIC=[['--color-bg','Page background','sand-50','#161513','#ffffff'],['--color-surface','Cards, header, dialogs','sand-0','#1f1d1a','#ffffff'],['--color-sunken','Wells, skeletons, inputs','sand-100','#12110f','#ffffff'],['--color-border','Dividers, card edges','sand-200','#38342e','#000000'],['--color-border-strong','Input and control edges (3:1)','sand-400','#7a7366','#000000'],['--color-text','Body and headings','sand-900','#ece7dd','#000000'],['--color-text-muted','Secondary text (4.5:1+)','sand-600','#b3ab9d','#1a1a1a'],['--color-primary','Primary actions, links','moss-600','#8fcfa0','#00452a'],['--color-accent','Focus ring, one highlight per screen','clay-600','#eaa27a','#6b2a0a'],['--color-warning','Under revision status','ochre-700','#e8c170','#4d3300'],['--color-error','Validation and load errors','brick-600','#f0988e','#7a0f08'],['--color-info','Beta status, neutral notices','slate-600','#a9c3d1','#0b2a3d']].map(r=>({token:r[0],role:r[1],light:r[2],dark:r[3],contrast:r[4]}));\nconst TYPE=[['display','clamp(2.5rem, 6vw, 3.5rem)','48 to 64px','600','-0.02em','Frontend prompts for Claude','600 clamp(2.5rem,6vw,3.5rem)/1.15 var(--font-sans)'],['heading-1','2rem','40px','600','-0.015em','Prompt library','600 2rem/2.5rem var(--font-sans)'],['heading-2','1.5rem','32px','600','-0.01em','What you get back','600 1.5rem/2rem var(--font-sans)'],['heading-3','1.25rem','28px','600','0','Design System Generator','600 1.25rem/1.75rem var(--font-sans)'],['body-lg','1.125rem','28px','400','0','A curated collection of Claude prompts for frontend development.','400 1.125rem/1.75rem var(--font-sans)'],['body','1rem','24px','400','0','Choose a prompt that fits your needs, then customize it for your project.','400 1rem/1.5rem var(--font-sans)'],['body-sm','0.875rem','20px','400','0','Stored on this device only.','400 0.875rem/1.25rem var(--font-sans)'],['code','0.875rem','24px','400','0','BRAND CONTEXT: [BRAND_NAME]','400 0.875rem/1.5rem var(--font-mono)'],['path','0.8125rem','20px','500','0.01em','prompts/ui-design/design-system-generator.md','500 0.8125rem/1.25rem var(--font-mono)']].map(r=>({token:r[0],size:r[1],lh:r[2],weight:r[3],tracking:r[4],sample:r[5],css:r[6]}));\nconst SPACE=[['space-0.5',4,'Icon to label inside a badge'],['space-1',8,'Gap between related controls'],['space-2',16,'Mobile page margin, card stack gap'],['space-3',24,'Card padding, grid gutter'],['space-4',32,'Desktop page margin'],['space-6',48,'Between groups inside a section'],['space-8',64,'Section padding on mobile'],['space-12',96,'Section padding on desktop']].
